<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Яйцерез</title>
<link rel="stylesheet" href="style.css">
<script>
  // тема до отрисовки, чтобы не мигало
  (function () {
    try {
      var t = localStorage.getItem('theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.lang = localStorage.getItem('lang') || 'ru';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
</head>
<body>
<div class="resize n" data-e="n"></div><div class="resize s" data-e="s"></div><div class="resize w" data-e="w"></div><div class="resize e" data-e="e"></div>
<div class="resize nw" data-e="nw"></div><div class="resize ne" data-e="ne"></div><div class="resize sw" data-e="sw"></div><div class="resize se" data-e="se"></div>

<div class="app">
<aside class="sidebar">
  <div class="ws" id="ws">
    <div class="wicon"><img src="logo.svg" alt="" width="38" height="38" draggable="false"></div>
    <div class="wtext">
      <div class="wname">Яйцерез</div>
      <div class="wstat" id="wstat" data-s="loading"><span class="sdot"></span><span id="wstatText"></span></div>
    </div>
  </div>
  <nav class="nav">
    <div class="item on" data-go="files"><span class="em">🎬</span><span class="lbl" data-i="nav_files"></span></div>
    <div class="item" data-go="result" id="navResult"><span class="em">✂️</span><span class="lbl" data-i="nav_result"></span><span class="badge" id="navBadge"></span></div>
    <div class="navsep"></div>
    <div class="item" data-go="settings"><span class="em">⚙️</span><span class="lbl" data-i="nav_settings"></span></div>
  </nav>
  <div class="side-spacer"></div>
</aside>

<div class="app-main">
  <div class="topbar" id="topbar">
    <div class="topbar-title" id="topTitle"></div>
    <div class="winctl">
      <button data-w="min" data-t="w_min"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5.5h10" stroke="currentColor" stroke-width="1"/></svg></button>
      <button data-w="max" data-t="w_max"><svg width="10" height="10" viewBox="0 0 10 10" id="maxIcon"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
      <button data-w="close" class="close" data-t="w_close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9" stroke="currentColor" stroke-width="1"/></svg></button>
    </div>
  </div>

<main id="views">
  <!-- 1. Исходники и настройки -->
  <section class="view page" id="view-files">
    <h1 class="page-title" data-i="page_files"></h1>
    <p class="page-sub" data-i="subtitle"></p>

    <div class="drop-empty" id="dropEmpty">
      <div class="drop-art">
        <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 16V4m0 0l-4.5 4.5M12 4l4.5 4.5M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="drop-title" data-i="drop_title"></div>
      <div class="drop-hint" data-i="drop_hint"></div>
      <button class="btn btn-secondary" data-action="pick" data-i="pick"></button>
    </div>
    <div class="projects" id="projects">
      <div class="proj-head"><span data-i="projects"></span><button class="btn btn-ghost btn-sm" id="openProjBtn" data-i="open_proj"></button></div>
      <div id="recentList"></div>
    </div>

    <div class="db" id="fileTable" hidden>
      <div class="db-head">
        <div class="col-name"><span class="col-ico">Aa</span><span data-i="col_file"></span></div>
        <div class="col-kind"><span class="col-ico">◉</span><span data-i="col_type"></span></div>
        <div class="col-info"><span class="col-ico">≡</span><span data-i="col_params"></span></div>
        <div class="col-dur"><span class="col-ico">#</span><span data-i="col_len"></span></div>
        <div class="col-x"></div>
      </div>
      <div id="fileRows"></div>
      <button class="db-add" data-action="pick"><span>＋</span><span data-i="add_files"></span></button>
    </div>

    <h2 class="section-title" data-i="settings"></h2>
    <div class="settings" id="settings"></div>

    <div class="page-actions">
      <button class="btn btn-primary btn-lg" id="startBtn" disabled data-i="start"></button>
      <span class="hint" id="startHint"></span>
    </div>
  </section>

  <!-- 2. Обработка -->
  <section class="view page narrow" id="view-progress" hidden>
    <div class="page-icon spin-egg"><img src="logo.svg" alt="" width="64" height="64"></div>
    <h1 class="page-title" data-i="cutting"></h1>
    <p class="page-sub" id="progressMsg"></p>
    <div class="steps" id="steps"></div>
    <div class="page-actions">
      <button class="btn btn-secondary" id="cancelBtn" data-i="cancel"></button>
    </div>
  </section>

  <!-- 3. Результат -->
  <section class="view wide" id="view-result" hidden>
    <div class="result-head">
      <div>
        <h1 class="page-title small" data-i="ready"></h1>
        <div class="stats" id="stats"></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-ghost" id="saveProjBtn"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 2.5h8l2.5 2.5v8.5h-11z M5 2.5v3.5h5v-3.5 M5 13.5v-4h6v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span data-i="save_proj"></span></button>
        <button class="btn btn-ghost" id="backBtn">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i="back"></span>
        </button>
        <div class="split-btn"><button class="btn btn-primary" id="exportBtn" data-i="export"></button><button class="btn btn-primary split-more" id="exportMore" data-t="xml_opts"><svg viewBox="0 0 12 12" width="10" height="10"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      </div>
    </div>

    <div class="callout warn" id="syncWarn" hidden></div>

    <div class="result-grid">
      <div class="player-col">
        <div class="player" id="player">
          <video id="vidA" class="deck" preload="auto" playsinline></video>
          <video id="vidB" class="deck" preload="auto" playsinline></video>
          <audio id="audA" preload="auto"></audio>
          <audio id="audB" preload="auto"></audio>
          <video id="vidScreen" class="screen-pip" preload="auto" muted playsinline></video>
          <div class="player-badge" id="playerBadge"></div>
          <div class="player-audio"><svg viewBox="0 0 48 48" width="56" height="56"><path d="M6 24h3M12 17v14M18 11v26M24 15v18M30 8v32M36 18v12M42 24h0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
          <div class="peek" id="srcMon" hidden>
            <div class="peek-screen" id="smScreen"><video id="smVideo" preload="auto" playsinline></video><audio id="smAudio" preload="auto"></audio>
              <div class="player-audio"><svg viewBox="0 0 48 48" width="52" height="52"><path d="M6 24h3M12 17v14M18 11v26M24 15v18M30 8v32M36 18v12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div></div>
            <div class="peek-top">
              <button class="peek-back" id="smClose"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i="sm_back"></span><kbd>Esc</kbd></button>
              <div class="peek-title"><b id="smTitle"></b><span id="smMeta"></span></div>
              <div class="peek-takes" id="smTakes"></div>
            </div>
            <div class="peek-bottom">
              <div class="peek-text" id="smText"></div>
              <div class="peek-bar" id="smBar"><div class="peek-fill" id="smFill"></div></div>
              <div class="peek-ctl">
                <button class="icon-btn peek-play" id="smPlay"></button>
                <span class="peek-hint" data-i="sm_hint"></span>
                <span class="peek-inedit" id="smInEdit" data-i="sm_in_edit"></span>
                <button class="btn btn-primary btn-sm" id="smInsert"></button>
              </div>
            </div>
          </div>
          <div class="player-wait" id="playerWait"><span class="spinner"></span><span id="playerWaitText"></span></div>
          <button class="player-big" id="bigPlay">
            <svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="controls">
          <button class="icon-btn" id="playBtn"></button>
          <span class="time" id="timeLabel">0:00 / 0:00</span>
          <button class="icon-btn" id="volBtn"></button>
          <div class="mini-slider" id="volSlider"><div class="track"></div><div class="fill" id="volFill"></div><div class="knob" id="volKnob"></div></div>
          <button class="select quality" id="qualityBtn"></button>
          <button class="select screen-btn" id="screenBtn" hidden></button>
          <span class="proxy-note" id="proxyNote"></span>
          <div class="controls-spacer"></div>
          <span class="now-text" id="nowText" data-t="now_hint"></span>
        </div>
        <div class="tl-wrap">
          <div class="tl-bar">
            <div class="tools" id="tools"></div>
            <div class="tl-legend" id="tlLegend"></div>
            <div class="tl-zoom">
              <button class="icon-btn" id="zoomOut" data-t="zoom_out">
                <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
              <div class="zoom-slider" id="zoomSlider"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
              <button class="icon-btn" id="zoomIn" data-t="zoom_in">
                <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 8h9M8 3.5v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
              <button class="chip" id="zoomFit" data-i="fit"></button>
            </div>
          </div>
          <div class="timeline" id="timeline"><canvas id="tlCanvas"></canvas></div>
          <div class="minimap" id="minimap"><canvas id="mmCanvas"></canvas><div class="mm-view" id="mmView"></div></div>
          <div class="tl-help" data-i="tl_help"></div>
          <div class="tracks" id="tracks"></div>
        </div>
      </div>

      <aside class="side">
        <div class="side-tabs">
          <button class="side-tab on" data-tab="text"><span data-i="tab_text"></span></button>
          <button class="side-tab" data-tab="settings"><span data-i="side_title"></span></button>
        </div>
        <div class="side-pane on" id="paneText">
          <div class="text-head">
            <div class="search">
      <div class="search-box">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" spellcheck="false" autocomplete="off" data-ph="search_ph">
        <span class="search-count" id="searchCount"></span>
        <button class="icon-btn" id="searchClear" hidden><svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
      <div class="search-actions" id="searchActions"></div>
    </div>
            <div class="text-sub">
              <span class="filter" id="phraseFilter"></span>
              <button class="chip follow on" id="followBtn" data-t="follow_hint"><span data-i="follow"></span></button>
            </div>
          </div>
          <div class="side-scroll" id="phraseScroll">
            <div class="phrases lyrics" id="phrases"></div>
          </div>
          <div class="hint search-hint text-foot" data-i="search_hint"></div>
        </div>
        <div class="side-pane" id="paneSettings">
          <div class="side-scroll">
            <div class="settings compact" id="liveSettings"></div>
          </div>
        </div>
      </aside>
    </div>



  </section>
  <!-- 4. Настройки программы -->
  <section class="view page" id="view-settings" hidden>
    <h1 class="page-title" data-i="nav_settings"></h1>
    <p class="page-sub" data-i="settings_sub"></p>
    <h2 class="section-title" data-i="sec_look"></h2>
    <div class="settings">
      <div class="set-row"><div class="set-text"><div class="set-label" data-i="lang"></div></div><div class="seg" id="langSeg"></div></div>
      <div class="set-row"><div class="set-text"><div class="set-label" data-i="theme"></div></div><div class="seg" id="themeSeg"></div></div>
    </div>
    <h2 class="section-title" data-i="sec_speech"></h2>
    <div class="callout" id="modelCallout" style="margin-top:8px"></div>
    <div class="settings"><div class="set-row"><div class="set-text"><div class="set-label" data-i="asr_label"></div><div class="set-desc" id="asrDesc"></div></div><div class="seg" id="asrSeg"></div></div></div>
    <h2 class="section-title" data-i="sec_llm"></h2>
    <div class="settings" id="llmBox"></div>
    <h2 class="section-title" data-i="sec_learn"></h2>
    <div class="settings" id="learnBox"></div>
    <h2 class="section-title" data-i="sec_keys"></h2>
    <div class="settings">
      <div class="set-row"><div class="set-text"><div class="set-label" data-i="hk_preset"></div><div class="set-desc" data-i="hk_preset_d"></div></div><div class="seg" id="hkPreset"></div>
        <button class="btn btn-ghost btn-sm" id="hkReset" data-i="hk_reset"></button></div>
    </div>
    <div class="hotkeys" id="hotkeys"></div>
    <h2 class="section-title" data-i="sec_cache"></h2>
    <div class="settings">
      <div class="set-row">
        <div class="set-text"><div class="set-label" data-i="cache_label"></div><div class="set-desc" id="cacheDesc"></div></div>
        <button class="btn btn-secondary" id="cacheOpen" data-i="open_folder"></button>
        <button class="btn btn-secondary" id="cacheClear" data-i="clear"></button>
      </div>
    </div>
    <p class="hint" id="aboutLine" style="margin-top:32px"></p>
  </section>
</main>
</div>
</div>

<div class="tl-tip" id="tlTip"></div>
<div class="drag-overlay" id="dragOverlay">
  <div class="drag-card">
    <svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 16V4m0 0l-4.5 4.5M12 4l4.5 4.5M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div data-i="drop_release"></div>
  </div>
</div>
<div class="cutcard" id="cutCard" hidden></div>
<div class="zoompanel" id="zoomPanel" hidden></div>

<div class="menu" id="menu" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="modal-back" id="closeAsk" hidden><div class="modal"><b data-i="close_title"></b><p data-i="close_text"></p>
  <div class="modal-actions"><button class="btn btn-ghost" id="closeCancel" data-i="close_cancel"></button><button class="btn btn-secondary" id="closeDiscard" data-i="close_discard"></button><button class="btn btn-primary" id="closeSave" data-i="close_save"></button></div></div></div>

<script>if (/[?&]mock/.test(location.search)) document.write('<script src="mock.js"><\/script>');</script>
<script src="i18n.js"></script>
<script src="editor.js"></script>
<script src="timeline.js"></script>
<script src="app.js"></script>
</body>
</html>
